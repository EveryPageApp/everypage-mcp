# Publishes to npm with provenance via npm Trusted Publishers (OIDC). No npm
# token is stored; configure this repo+workflow as a Trusted Publisher for the
# package on npmjs.com (package settings -> Trusted Publishers).
#
# The MCP registry entry is published separately and by hand - it needs the
# DNS signing key for the co.everypage/* namespace, which deliberately never
# reaches CI. See PUBLISHING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10, which predates the trusted-publishing OIDC
      # exchange - npm >= 11.5 is required for tokenless publish + provenance.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
